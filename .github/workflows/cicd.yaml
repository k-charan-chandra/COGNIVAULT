name: COGNIVAULT AWS CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"

  workflow_dispatch:

# Prevent two deployments from running at the same time
concurrency:
  group: cognivault-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  # ============================================================
  # 1. CONTINUOUS INTEGRATION
  # ============================================================
  integration:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python files
        run: |
          python -m compileall Chatbot.py rag.py app_thread.py

  # ============================================================
  # 2. BUILD AND PUSH DOCKER IMAGE
  # ============================================================
  push_to_registry:
    name: Build and Push Docker Image
    needs: integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker settings
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_NAME: ${{ secrets.IMAGE_NAME }}
        run: |
          if [ -z "$DOCKER_USERNAME" ]; then
            echo "DOCKER_USERNAME secret is missing."
            exit 1
          fi

          if [ -z "$IMAGE_NAME" ]; then
            echo "IMAGE_NAME secret is missing."
            exit 1
          fi

          echo "Docker image settings are configured."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.IMAGE_NAME }}:main
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # 3. CONTINUOUS DEPLOYMENT TO AWS EC2
  # ============================================================
  continuous_deployment:
    name: Deploy COGNIVAULT to AWS EC2
    needs: push_to_registry
    runs-on: self-hosted

    steps:

      # ----------------------------------------------------------
      # Docker Hub Login
      # ----------------------------------------------------------
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ----------------------------------------------------------
      # Validate COGNIVAULT Secrets
      # ----------------------------------------------------------
      - name: Validate application secrets
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |

          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "OPENROUTER_API_KEY secret is missing."
            exit 1
          fi

          if [ -z "$TAVILY_API_KEY" ]; then
            echo "TAVILY_API_KEY secret is missing."
            exit 1
          fi

          if [ -z "$GOOGLE_API_KEY" ]; then
            echo "GOOGLE_API_KEY secret is missing."
            exit 1
          fi

          echo "All required COGNIVAULT secrets are configured."

      # ----------------------------------------------------------
      # Pull Latest Docker Image
      # ----------------------------------------------------------
      - name: Pull latest Docker image
        env:
          IMAGE_PATH: ${{ secrets.DOCKER_USERNAME }}/${{ secrets.IMAGE_NAME }}
        run: |
          docker pull "${IMAGE_PATH}:main"

      # ----------------------------------------------------------
      # Stop Existing Container
      # ----------------------------------------------------------
      - name: Stop and remove existing container
        run: |
          docker rm -f cognivault 2>/dev/null || true

      # ----------------------------------------------------------
      # Run COGNIVAULT
      # ----------------------------------------------------------
      - name: Run COGNIVAULT container
        env:
          IMAGE_PATH: ${{ secrets.DOCKER_USERNAME }}/${{ secrets.IMAGE_NAME }}

          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

        run: |
          docker run -d \
            --restart unless-stopped \
            --name cognivault \
            -p 8501:8501 \
            -e OPENROUTER_API_KEY \
            -e TAVILY_API_KEY \
            -e GOOGLE_API_KEY \
            "${IMAGE_PATH}:main"

      # ----------------------------------------------------------
      # Verify Container
      # ----------------------------------------------------------
      - name: Verify container is running
        run: |
          sleep 10

          if ! docker ps \
            --filter "name=^cognivault$" \
            --filter "status=running" \
            --format "{{.Names}}" | grep -q "^cognivault$"; then

            echo "COGNIVAULT container failed to start."

            docker logs cognivault || true

            exit 1
          fi

          echo "COGNIVAULT container is running."

          docker ps --filter "name=^cognivault$"

      # ----------------------------------------------------------
      # Verify Streamlit Health
      # ----------------------------------------------------------
      - name: Verify Streamlit health endpoint
        run: |

          for attempt in $(seq 1 12); do

            if docker exec cognivault python -c \
              "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=5)" \
              >/dev/null 2>&1; then

              echo "COGNIVAULT Streamlit application is healthy."

              exit 0
            fi

            echo "Waiting for COGNIVAULT to become ready..."

            sleep 5

          done

          echo "COGNIVAULT did not become healthy."

          docker logs --tail 100 cognivault || true

          exit 1

      # ----------------------------------------------------------
      # Show Application Logs
      # ----------------------------------------------------------
      - name: Show recent application logs
        if: always()
        run: |
          docker logs --tail 50 cognivault 2>/dev/null || true

      # ----------------------------------------------------------
      # Clean Unused Docker Images
      # ----------------------------------------------------------
      - name: Remove unused Docker images
        if: always()
        run: |
          docker image prune -f